name: test
on:
  push:
  pull_request:
  schedule:
    - cron: "23 7 * * 1"
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tests/compare_test.sh
  inputs-stay-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          config: tests/ownerwatch.yaml
          baseline: tests/admin-surface.md
          label: '$(touch pwned-label) `touch pwned-label2`'
      - run: test ! -e pwned-label && test ! -e pwned-label2
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        id: check
        with:
          config: tests/ownerwatch.yaml
          baseline: tests/admin-surface.md
          label: "ownerwatch-action test"
      - run: echo "drifted=${{ steps.check.outputs.drifted }} report=${{ steps.check.outputs.report }}"
  disclosure-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        id: check
        with:
          disclosure: tests/disclosure.json
          rpc: https://ethereum-rpc.publicnode.com
      - run: test "${{ steps.check.outputs.disclosure-ok }}" = "true"
