name: "ownerwatch admin-surface check"
description: "Fail CI when the admin surface of your EVM contracts drifts: owners, proxy admins, implementations, roles, Safe signers and thresholds, timelock delays."
author: "imal1ice"
branding:
  icon: "shield"
  color: "blue"
inputs:
  config:
    description: "Path to the ownerwatch config listing the contracts and Safes to probe."
    required: false
    default: "ownerwatch.yaml"
  baseline:
    description: "Path to the committed admin-surface report to compare against. Commit the generated report here on the first run."
    required: false
    default: "admin-surface.md"
  label:
    description: "Protocol name used in the report heading."
    required: false
    default: "${{ github.repository }}"
  rpc:
    description: "RPC URL that allows eth_call, overriding the config for single-chain configs. Multi-chain configs set probe_rpc_url per chain instead."
    required: false
    default: ""
  roles-from-logs:
    description: "Replay RoleGranted/RoleRevoked logs to list every current role holder (slower; needs log history)."
    required: false
    default: "false"
  fail-on-drift:
    description: "Fail the step when the report differs from the baseline, when no baseline exists yet, or when a disclosure does not match chain state. A run that could not read the chain always fails."
    required: false
    default: "true"
  disclosure:
    description: "Path to a committed ERC-8241 control disclosure (JSON). When set, it is checked against chain state and the step fails on any mismatch or undisclosed power. Needs ownerwatch >= 0.9.0 and the rpc input."
    required: false
    default: ""
  disclosure-roles-from-logs:
    description: "With disclosure: replay role grants from logs so every role holder counts towards completeness."
    required: false
    default: "true"
  logs-rpc:
    description: "RPC for eth_getLogs in the role replay, for the drift check and the disclosure check (default for the drift check: the config's rpc_url; for the disclosure check: a public full-history gateway, else rpc)."
    required: false
    default: ""
  version:
    description: "ownerwatch version to install from PyPI. The default is the version this Action release was tested with, so a new ownerwatch release cannot read as drift. Set 'latest' to always take the newest."
    required: false
    default: "0.11.0"
outputs:
  drifted:
    description: "true when the admin surface differs from the baseline or no baseline exists."
    value: ${{ steps.compare.outputs.drifted }}
  report:
    description: "Path of the freshly generated report."
    value: ${{ steps.probe.outputs.report }}
  disclosure-ok:
    description: "true when the ERC-8241 disclosure matches chain state with nothing undisclosed; empty when no disclosure is set."
    value: ${{ steps.disclosure.outputs.ok }}
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install ownerwatch
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [ -n "$VERSION" ] && [ "$VERSION" != "latest" ]; then pip install -q "ownerwatch==$VERSION"; else pip install -q ownerwatch; fi
        ownerwatch --version
    # Inputs reach the scripts through env, never by interpolation into the script text: a label or path
    # containing $(...) or a quote must stay data.
    - name: Probe the admin surface
      id: probe
      # a disclosure-only setup has no config to probe
      if: inputs.disclosure == '' || hashFiles(inputs.config) != ''
      shell: bash
      env:
        BASE: ${{ inputs.baseline }}
        CONFIG: ${{ inputs.config }}
        LABEL: ${{ inputs.label }}
        RPC: ${{ inputs.rpc }}
        ROLES_FROM_LOGS: ${{ inputs.roles-from-logs }}
        LOGS_RPC: ${{ inputs.logs-rpc }}
      run: |
        set -euo pipefail
        report="${BASE%.md}.new.md"
        args=(probe --config "$CONFIG" --markdown --label "$LABEL")
        if [ -n "$RPC" ]; then args+=(--rpc "$RPC"); fi
        if [ "$ROLES_FROM_LOGS" = "true" ]; then args+=(--roles-from-logs); fi
        if [ -n "$LOGS_RPC" ]; then args+=(--logs-rpc "$LOGS_RPC"); fi
        ownerwatch "${args[@]}" > "$report"
        echo "report=$report" >> "$GITHUB_OUTPUT"
    - name: Compare with the committed baseline
      id: compare
      if: inputs.disclosure == '' || hashFiles(inputs.config) != ''
      shell: bash
      env:
        BASE: ${{ inputs.baseline }}
        REPORT: ${{ steps.probe.outputs.report }}
        FAIL_ON_DRIFT: ${{ inputs.fail-on-drift }}
      run: '"$GITHUB_ACTION_PATH/compare.sh"'
    - name: Check the ERC-8241 disclosure
      id: disclosure
      # runs even when the drift check above failed, so one run reports both
      if: ${{ !cancelled() && inputs.disclosure != '' }}
      shell: bash
      env:
        DISCLOSURE: ${{ inputs.disclosure }}
        RPC: ${{ inputs.rpc }}
        ROLES_FROM_LOGS: ${{ inputs.disclosure-roles-from-logs }}
        LOGS_RPC: ${{ inputs.logs-rpc }}
        FAIL_ON_DRIFT: ${{ inputs.fail-on-drift }}
      run: |
        set -uo pipefail
        if [ -z "$RPC" ]; then echo "::error::The disclosure input needs the rpc input."; exit 1; fi
        args=(disclosure check "$DISCLOSURE" --rpc "$RPC")
        if [ "$ROLES_FROM_LOGS" != "true" ]; then args+=(--no-roles-from-logs); fi
        if [ -n "$LOGS_RPC" ]; then args+=(--logs-rpc "$LOGS_RPC"); fi
        rc=0
        out=$(ownerwatch "${args[@]}") || rc=$?
        echo "$out"
        if [ $rc -ne 0 ] && [ $rc -ne 1 ]; then
          # exit 2: the chain could not be read, which says nothing about the disclosure
          echo "::error::The ERC-8241 check could not run (exit $rc). See the log above."
          exit "$rc"
        fi
        {
          if [ $rc -eq 0 ]; then echo "## ERC-8241 disclosure matches chain state"; else echo "## ERC-8241 disclosure does not match chain state"; fi
          echo
          echo '```'
          echo "$out"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        if [ $rc -eq 0 ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; fi
        echo "ok=false" >> "$GITHUB_OUTPUT"
        echo "::error::The ERC-8241 disclosure at $DISCLOSURE does not match chain state. Fix the disclosure or the contracts, then re-run."
        if [ "$FAIL_ON_DRIFT" = "true" ]; then exit 1; fi
